    }

      background: #fff3f6;
      padding: 20px;
      line-height: 1.6;
    }

      max-width: 800px;

      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      color: #e84393;
      margin-bottom: 30px;
    }

    .input-section {
      text-align: center;
      margin-bottom: 30px;
    }

    input {
      width: 80%;
      max-width: 400px;
      padding: 15px;
      font-size: 16px;
      border: 2px solid #ffc9d5;
      border-radius: 10px;
      outline: none;
      margin: 5px 0;
    }

    input:focus {
      border-color: #e84393;
    }

    button {
      display: block;
      width: 200px;
      margin: 20px auto;
      padding: 15px;
      background: #e84393;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-size: 16px;
      transition: 0.3s;
    }

    button:hover {
      background: #d63384;
      transform: translateY(-2px);
    }

    .result {
      display: none;
      background: #fff8fa;
      padding: 25px;
      border-radius: 10px;
      margin-top: 30px;
    }

    .love-score, .compatibility-score {

      font-size: 22px;
      margin: 20px 0;
      color: #e84393;

    .analysis-box h2 {

    }

    .highlight {

    function calculateCompatibility(num1, num2) {
      const diff = Math.abs(num1 - num2);
      let score = 100 - (diff * 5);
      if (score < 50) score = 50;
      return score;
    }
